<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Provenance-aware artifact comparison</title><desc id="desc">Two artifacts carry input, execution, scoring, and per-case evidence. A compatibility gate permits comparison or reports differences.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker><style>.t{font:700 29px system-ui;fill:#0f172a}.h{font:700 18px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb}.teal{fill:#ecfeff;stroke:#0f766e}.red{fill:#fef2f2;stroke:#b91c1c}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="700" rx="24" fill="#f8fafc"/><text x="50" y="55" class="t">Provenance-aware A/B Comparison</text><text x="50" y="82" class="s">Compare conditions before comparing aggregate scores.</text>
  <rect x="55" y="125" width="330" height="360" class="box blue"/><text x="220" y="165" text-anchor="middle" class="h">Artifact A</text><rect x="85" y="190" width="270" height="56" class="box"/><text x="220" y="224" text-anchor="middle" class="s">Input: dataset · schema · selection</text><rect x="85" y="265" width="270" height="56" class="box"/><text x="220" y="299" text-anchor="middle" class="s">Execution: model · runtime · budgets</text><rect x="85" y="340" width="270" height="56" class="box"/><text x="220" y="374" text-anchor="middle" class="s">Scoring: fields · paths · judge</text><rect x="85" y="415" width="270" height="45" class="box"/><text x="220" y="443" text-anchor="middle" class="s">Per-case evidence</text>
  <rect x="815" y="125" width="330" height="360" class="box blue"/><text x="980" y="165" text-anchor="middle" class="h">Artifact B</text><rect x="845" y="190" width="270" height="56" class="box"/><text x="980" y="224" text-anchor="middle" class="s">Input: dataset · schema · selection</text><rect x="845" y="265" width="270" height="56" class="box"/><text x="980" y="299" text-anchor="middle" class="s">Execution: model · runtime · budgets</text><rect x="845" y="340" width="270" height="56" class="box"/><text x="980" y="374" text-anchor="middle" class="s">Scoring: fields · paths · judge</text><rect x="845" y="415" width="270" height="45" class="box"/><text x="980" y="443" text-anchor="middle" class="s">Per-case evidence</text>
  <path d="M385 305H480" class="line"/><path d="M815 305H720" class="line"/><path d="M600 190 720 305 600 420 480 305Z" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="600" y="285" text-anchor="middle" class="h">Compatibility</text><text x="600" y="310" text-anchor="middle" class="h">Gate</text><text x="600" y="338" text-anchor="middle" class="s">only intended variable differs?</text>
  <path d="M540 390V545H310" class="line"/><rect x="55" y="545" width="510" height="95" class="box red"/><text x="310" y="580" text-anchor="middle" class="h">Not directly comparable</text><text x="310" y="607" text-anchor="middle" class="s">report population and policy differences first</text><path d="M660 390V545H890" class="line"/><rect x="635" y="545" width="510" height="95" class="box teal"/><text x="890" y="580" text-anchor="middle" class="h">Comparable</text><text x="890" y="607" text-anchor="middle" class="s">aggregate delta + per-case pass↔fail transitions</text><text x="50" y="675" class="s">Same accuracy does not imply same behavior; preserve failure category and path evidence for triage.</text>
</svg>
