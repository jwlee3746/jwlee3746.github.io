<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc">
  <title id="title">Generalized LLM agent evaluation reference architecture</title>
  <desc id="desc">Versioned test cases flow through shared validation, projection, execution, deterministic scoring, and provenance-rich artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:16px system-ui,sans-serif;fill:#64748b}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.accent{fill:#ecfeff;stroke:#0f766e}.blue{fill:#eff6ff;stroke:#2563eb}.amber{fill:#fffbeb;stroke:#b45309}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="580" rx="24" fill="#f8fafc"/>
  <text x="60" y="58" class="title">LLM Agent Evaluation — Conceptual Reference Architecture</text>
  <text x="60" y="88" class="sub">설명용 일반화 모델 · 실제 프로덕션 topology가 아님</text>
  <rect x="55" y="180" width="170" height="130" class="box blue"/><text x="140" y="220" text-anchor="middle" class="label">Versioned</text><text x="140" y="245" text-anchor="middle" class="label">Test Cases</text><text x="140" y="275" text-anchor="middle" class="small">context · paths</text><text x="140" y="296" text-anchor="middle" class="small">tool evidence</text>
  <rect x="270" y="180" width="170" height="130" class="box accent"/><text x="355" y="220" text-anchor="middle" class="label">Shared</text><text x="355" y="245" text-anchor="middle" class="label">Validation</text><text x="355" y="275" text-anchor="middle" class="small">schema · relations</text><text x="355" y="296" text-anchor="middle" class="small">CI + preflight</text>
  <rect x="485" y="180" width="170" height="130" class="box"/><text x="570" y="220" text-anchor="middle" class="label">Projection</text><text x="570" y="252" text-anchor="middle" class="small">runtime requests</text><text x="570" y="275" text-anchor="middle" class="small">expected paths</text><text x="570" y="298" text-anchor="middle" class="small">kept separate</text>
  <rect x="700" y="180" width="170" height="130" class="box"/><text x="785" y="220" text-anchor="middle" class="label">Execution</text><text x="785" y="252" text-anchor="middle" class="small">multi-step replay</text><text x="785" y="275" text-anchor="middle" class="small">budgets · retries</text><text x="785" y="298" text-anchor="middle" class="small">checkpoint</text>
  <rect x="915" y="180" width="170" height="130" class="box amber"/><text x="1000" y="220" text-anchor="middle" class="label">Scoring</text><text x="1000" y="252" text-anchor="middle" class="small">deterministic path</text><text x="1000" y="275" text-anchor="middle" class="small">failure taxonomy</text><text x="1000" y="298" text-anchor="middle" class="small">optional judge</text>
  <path d="M225 245H270" class="line"/><path d="M440 245H485" class="line"/><path d="M655 245H700" class="line"/><path d="M870 245H915" class="line"/>
  <rect x="270" y="390" width="170" height="92" class="box accent"/><text x="355" y="425" text-anchor="middle" class="label">CI Merge Gate</text><text x="355" y="453" text-anchor="middle" class="small">same validation core</text><path d="M355 310V390" class="line"/>
  <rect x="700" y="390" width="385" height="92" class="box blue"/><text x="892" y="425" text-anchor="middle" class="label">Provenance-rich Artifact</text><text x="892" y="453" text-anchor="middle" class="small">population · policy · revisions · per-step evidence</text><path d="M1000 310V350H892V390" class="line"/>
  <text x="60" y="545" class="sub">핵심: 입력 계약부터 실행 조건과 판정 근거까지 하나의 versioned evaluation workflow로 관리한다.</text>
</svg>
