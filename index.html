<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="이재원 - Machine Learning Engineer">
    <title>이재원</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        line-height: 1.6;
        background: #ffffff;
        color: #16181d;
      }
      main { max-width: 32rem; text-align: center; }
      .eyebrow {
        margin: 0 0 0.5rem;
        font-size: 0.8rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #8b93a1;
      }
      h1 { margin: 0 0 0.75rem; font-size: clamp(1.75rem, 5vw, 2.5rem); letter-spacing: -0.02em; }
      p.lead { margin: 0 0 1.75rem; color: #5c6370; }
      a.cta {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.15s ease, color 0.15s ease;
      }
      a.cta:hover, a.cta:focus-visible { background: #16181d; color: #ffffff; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #e6e8ec; }
        p.lead { color: #9aa1ad; }
        .eyebrow { color: #6b7280; }
        a.cta:hover, a.cta:focus-visible { background: #e6e8ec; color: #0f1115; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Machine Learning Engineer · Seoul</p>
      <h1>이재원</h1>
      <p class="lead">포트폴리오 페이지를 새로 만들고 있습니다.</p>
      <a class="cta" href="/blog/">기술 블로그 보기 →</a>
    </main>
  </body>
</html>
