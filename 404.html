<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지를 찾을 수 없습니다 | 이재원</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        line-height: 1.6;
        background: hsl(0deg 0% 100%);
        color: hsl(200deg 18% 22%);
      }
      main { max-width: 32rem; text-align: center; }
      h1 { color: hsl(188deg 52% 18%); margin: 0 0 0.5rem; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -0.03em; }
      p.lead { margin: 0 0 1.75rem; color: hsl(200deg 12% 45%); }
      .link-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      a.cta {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.15s ease, color 0.15s ease;
      }
      a.cta { color: hsl(178deg 84% 26%); border-color: hsl(190deg 25% 90%); }
      a.cta:hover, a.cta:focus-visible { background: hsl(178deg 84% 26%); color: #fff; border-color: transparent; }
      @media (prefers-color-scheme: dark) {
        body { background: hsl(215deg 22% 8%); color: hsl(208deg 14% 70%); }
        h1 { color: hsl(168deg 55% 85%); }
        p.lead { color: hsl(207deg 9% 52%); }
        a.cta { color: hsl(168deg 76% 65%); border-color: hsl(210deg 17% 18%); }
        a.cta:hover, a.cta:focus-visible { background: hsl(168deg 76% 65%); color: hsl(215deg 22% 8%); border-color: transparent; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p class="lead">요청하신 페이지를 찾을 수 없습니다.</p>
      <div class="link-row">
        <a class="cta" href="/">홈으로 <span aria-hidden="true">→</span></a>
        <a class="cta" href="/blog/">Blog 보기 <span aria-hidden="true">→</span></a>
      </div>
    </main>
  </body>
</html>
