<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>페이지를 찾을 수 없습니다 | 이재원</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
        line-height: 1.6;
        background: #ffffff;
        color: #16181d;
      }
      main { max-width: 32rem; text-align: center; }
      h1 { margin: 0 0 0.5rem; font-size: clamp(2.5rem, 8vw, 4rem); letter-spacing: -0.03em; }
      p.lead { margin: 0 0 1.75rem; color: #5c6370; }
      .link-row { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
      a.cta {
        display: inline-block;
        padding: 0.7rem 1.4rem;
        border: 1px solid currentColor;
        border-radius: 999px;
        color: inherit;
        text-decoration: none;
        font-weight: 500;
        transition: background 0.15s ease, color 0.15s ease;
      }
      a.cta:hover, a.cta:focus-visible { background: #16181d; color: #ffffff; }
      @media (prefers-color-scheme: dark) {
        body { background: #0f1115; color: #e6e8ec; }
        p.lead { color: #9aa1ad; }
        a.cta:hover, a.cta:focus-visible { background: #e6e8ec; color: #0f1115; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p class="lead">요청하신 페이지를 찾을 수 없습니다.</p>
      <div class="link-row">
        <a class="cta" href="/">홈으로 <span aria-hidden="true">→</span></a>
        <a class="cta" href="/blog/">Blog 보기 <span aria-hidden="true">→</span></a>
      </div>
    </main>
  </body>
</html>
