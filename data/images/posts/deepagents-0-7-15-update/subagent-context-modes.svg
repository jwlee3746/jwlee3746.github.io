<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of isolated and fork subagent context modes</title>
  <desc id="desc">Isolated passes only a task description to the subagent, while fork copies the parent conversation and appends the task. Isolated minimizes context; fork preserves prior constraints and decisions.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker><filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter><style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:16px system-ui,sans-serif;fill:#64748b}.head{font:700 21px system-ui,sans-serif;fill:#0f172a}.label{font:700 15px system-ui,sans-serif}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.blue{fill:#eff6ff;stroke:#2563eb}.violet{fill:#f5f3ff;stroke:#7c3aed}.green{fill:#ecfdf5;stroke:#059669}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.fork{stroke:#7c3aed;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="650" rx="24" fill="#f8fafc"/>
  <text x="55" y="58" class="title">Subagent 문맥은 위임 목적에 맞게 고른다</text><text x="55" y="88" class="sub">isolated는 최소 문맥을, fork는 지금까지의 판단을 작업 입력으로 삼는다.</text>
  <rect x="55" y="155" width="255" height="160" class="box blue"/><text x="182" y="198" text-anchor="middle" class="head">Parent Agent</text><text x="182" y="236" text-anchor="middle" class="small">사용자 제약 · 조사 근거</text><text x="182" y="268" text-anchor="middle" class="small">이전 결정 · 실패한 시도</text><text x="182" y="294" text-anchor="middle" class="tiny">conversation history</text>

  <text x="520" y="150" text-anchor="middle" class="label" fill="#2563eb">mode="isolated"</text><rect x="400" y="170" width="240" height="115" class="box"/><text x="520" y="213" text-anchor="middle" class="head">Task 설명</text><text x="520" y="250" text-anchor="middle" class="small">선별해 다시 작성한 문맥</text><path d="M310 235H400" class="line"/>
  <rect x="760" y="155" width="350" height="160" class="box green"/><text x="935" y="198" text-anchor="middle" class="head">Isolated Subagent</text><text x="935" y="236" text-anchor="middle" class="small">task만 보고 독립적으로 수행</text><text x="935" y="268" text-anchor="middle" class="small">검색 · 작은 분석 · 민감 문맥 분리</text><text x="935" y="294" text-anchor="middle" class="tiny">낮은 토큰 비용 · 높은 격리</text><path d="M640 235H760" class="line"/>

  <text x="520" y="382" text-anchor="middle" class="label" fill="#7c3aed">mode="fork"</text><rect x="400" y="402" width="240" height="125" class="box violet"/><text x="520" y="444" text-anchor="middle" class="head">History 복사</text><text x="520" y="479" text-anchor="middle" class="small">부모 대화 + task</text><text x="520" y="505" text-anchor="middle" class="tiny">fork 지점부터 별도 실행</text><path d="M310 465H400" class="fork"/>
  <rect x="760" y="390" width="350" height="160" class="box violet"/><text x="935" y="433" text-anchor="middle" class="head">Forked Subagent</text><text x="935" y="471" text-anchor="middle" class="small">제약과 이전 판단을 그대로 이어받음</text><text x="935" y="503" text-anchor="middle" class="small">초안 리뷰 · 디버깅 · 연속 작업</text><text x="935" y="529" text-anchor="middle" class="tiny">정보 보존 · 토큰/노출 범위 증가</text><path d="M640 465H760" class="fork"/>
  <path d="M182 315V465H400" class="fork"/>
  <text x="55" y="602" class="sub">선택 기준: 부모의 판단 과정 자체가 subagent가 수행할 작업의 필수 입력인가?</text>
</svg>
