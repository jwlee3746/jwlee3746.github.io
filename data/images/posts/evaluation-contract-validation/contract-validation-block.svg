<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Shared validation core block diagram</title><desc id="desc">Trace evidence becomes versioned test cases and schemas, checked by one validation core reused by CI and runtime preflight.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker><style>.t{font:700 30px system-ui;fill:#0f172a}.h{font:700 19px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.cap{font:700 15px system-ui;fill:#64748b;letter-spacing:1px}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb}.teal{fill:#ecfeff;stroke:#0f766e}.amber{fill:#fffbeb;stroke:#b45309}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6;fill:none;marker-end:url(#arrow)}</style></defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/><text x="55" y="58" class="t">Contract &amp; Validation Boundary</text><text x="55" y="87" class="s">Conceptual block diagram · shared rules, different failure boundaries</text>
  <text x="55" y="140" class="cap">AUTHORING SOURCES</text><rect x="55" y="165" width="260" height="90" class="box"/><text x="185" y="200" text-anchor="middle" class="h">Trace Evidence</text><text x="185" y="228" text-anchor="middle" class="s">observed request · tool result</text><rect x="55" y="285" width="260" height="90" class="box blue"/><text x="185" y="320" text-anchor="middle" class="h">Versioned Test Cases</text><text x="185" y="348" text-anchor="middle" class="s">context · paths · provenance</text><rect x="55" y="405" width="260" height="90" class="box blue"/><text x="185" y="440" text-anchor="middle" class="h">Committed Schemas</text><text x="185" y="468" text-anchor="middle" class="s">value and object contracts</text><path d="M185 255V285" class="dash"/>
  <text x="445" y="140" class="cap">SHARED VALIDATION CORE</text><rect x="410" y="165" width="350" height="330" class="box teal"/><rect x="450" y="200" width="270" height="70" class="box"/><text x="585" y="229" text-anchor="middle" class="h">Schema Validation</text><text x="585" y="251" text-anchor="middle" class="s">parse · shape · value</text><rect x="450" y="295" width="270" height="70" class="box"/><text x="585" y="324" text-anchor="middle" class="h">Case Relations</text><text x="585" y="346" text-anchor="middle" class="s">references · path consistency</text><rect x="450" y="390" width="270" height="70" class="box"/><text x="585" y="419" text-anchor="middle" class="h">Dataset Relations</text><text x="585" y="441" text-anchor="middle" class="s">topology · uniqueness · counts</text><path d="M315 330H390V235H450" class="line"/><path d="M315 450H390V235H450" class="line"/>
  <text x="880" y="140" class="cap">ENFORCEMENT BOUNDARIES</text><rect x="850" y="180" width="295" height="120" class="box amber"/><text x="997" y="218" text-anchor="middle" class="h">CI Merge Gate</text><text x="997" y="246" text-anchor="middle" class="s">invalid → review blocked</text><text x="997" y="269" text-anchor="middle" class="s">valid → merge eligible</text><rect x="850" y="365" width="295" height="130" class="box amber"/><text x="997" y="403" text-anchor="middle" class="h">Runtime Preflight</text><text x="997" y="431" text-anchor="middle" class="s">validate → select → count</text><text x="997" y="454" text-anchor="middle" class="s">invalid / empty → abort before call</text><path d="M760 260H850" class="line"/><path d="M760 420H850" class="line"/>
  <rect x="410" y="565" width="735" height="85" class="box"/><text x="777" y="600" text-anchor="middle" class="h">One rule set, two callers</text><text x="777" y="627" text-anchor="middle" class="s">Validator reports issues only; authoring tools perform explicit, reviewable transformations.</text><path d="M585 495V565" class="line"/>
</svg>
