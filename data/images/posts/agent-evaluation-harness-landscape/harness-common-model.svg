<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Common agent evaluation harness model</title>
  <desc id="desc">A task package is loaded by a harness that connects an agent, environment, scorer, and trial controller and emits traceable artifacts.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:16px system-ui,sans-serif;fill:#64748b}.label{font:700 18px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.cyan{fill:#ecfeff;stroke:#0f766e}.blue{fill:#eff6ff;stroke:#2563eb}.amber{fill:#fffbeb;stroke:#b45309}.violet{fill:#f5f3ff;stroke:#7c3aed}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.both{stroke:#475569;stroke-width:2.5;fill:none;marker-start:url(#arrow);marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="#f8fafc"/>
  <text x="55" y="56" class="title">Agent Evaluation Harness — Converging Common Model</text><text x="55" y="86" class="sub">하나의 표준보다 task · agent · environment · scorer · trial · artifact 경계가 수렴하고 있다.</text>

  <rect x="50" y="145" width="250" height="330" class="box blue"/><text x="175" y="184" text-anchor="middle" class="label">Task Package</text>
  <rect x="78" y="215" width="194" height="46" rx="10" fill="#fff" stroke="#93c5fd"/><text x="175" y="244" text-anchor="middle" class="small">Instruction / Sample</text>
  <rect x="78" y="278" width="194" height="46" rx="10" fill="#fff" stroke="#93c5fd"/><text x="175" y="307" text-anchor="middle" class="small">Initial State / Tools</text>
  <rect x="78" y="341" width="194" height="46" rx="10" fill="#fff" stroke="#93c5fd"/><text x="175" y="370" text-anchor="middle" class="small">Policy / Graders</text>
  <rect x="78" y="404" width="194" height="46" rx="10" fill="#fff" stroke="#93c5fd"/><text x="175" y="433" text-anchor="middle" class="small">Metadata / Revisions</text>

  <rect x="385" y="125" width="470" height="400" class="box cyan"/><text x="620" y="165" text-anchor="middle" class="label">Evaluation Harness</text>
  <rect x="420" y="210" width="165" height="95" class="box amber"/><text x="502" y="246" text-anchor="middle" class="label">Agent</text><text x="502" y="275" text-anchor="middle" class="small">solver · adapter</text>
  <rect x="655" y="210" width="165" height="95" class="box violet"/><text x="737" y="246" text-anchor="middle" class="label">Environment</text><text x="737" y="275" text-anchor="middle" class="small">tools · sandbox · user</text>
  <path d="M585 257H655" class="both"/>
  <rect x="420" y="365" width="165" height="95" class="box"/><text x="502" y="401" text-anchor="middle" class="label">Trial Control</text><text x="502" y="430" text-anchor="middle" class="small">epochs · reset · retry</text>
  <rect x="655" y="365" width="165" height="95" class="box"/><text x="737" y="401" text-anchor="middle" class="label">Scorers</text><text x="737" y="430" text-anchor="middle" class="small">state · rule · model</text>
  <path d="M585 412H655" class="line"/>
  <path d="M300 310H385" class="line"/>

  <rect x="940" y="145" width="210" height="330" class="box violet"/><text x="1045" y="184" text-anchor="middle" class="label">Artifacts</text><text x="1045" y="235" text-anchor="middle" class="small">task + trial status</text><text x="1045" y="270" text-anchor="middle" class="small">scores + evidence</text><text x="1045" y="305" text-anchor="middle" class="small">final state</text><text x="1045" y="340" text-anchor="middle" class="small">trace reference</text><text x="1045" y="375" text-anchor="middle" class="small">provenance</text><text x="1045" y="425" text-anchor="middle" class="tiny">comparable only within</text><text x="1045" y="446" text-anchor="middle" class="tiny">declared boundaries</text>
  <path d="M855 310H940" class="line"/>

  <rect x="270" y="580" width="660" height="65" class="box blue"/><text x="600" y="608" text-anchor="middle" class="label">Observability Plane</text><text x="600" y="630" text-anchor="middle" class="small">spans · traces · sessions · online scores · production feedback</text>
  <path d="M620 525V580" class="dash"/><path d="M1045 475V550H800V580" class="dash"/>
  <text x="55" y="673" class="sub">Harness는 실행을 표준화한다. 좋은 task, environment fidelity와 grader validity는 별도로 검증해야 한다.</text>
</svg>
