<svg xmlns="http://www.w3.org/2000/svg" width="660" height="370" viewBox="0 0 660 370" role="img" aria-labelledby="title desc" data-article-diagram="true" class="article-diagram-art">
<title id="title">토큰 정보 + 위치 정보</title><desc id="desc">임베딩을 모델 차원의 제곱근으로 스케일링하고 같은 차원의 위치 벡터를 더한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-link, #78b8ff)"/></marker></defs>
<style>
.article-diagram-art {font-family:var(--font-body, sans-serif);font-size:16px;color:var(--color-text,#ddd)}
.article-diagram-art text {fill:var(--color-heading,#eee);font-family:var(--font-body, sans-serif);font-size:1rem}
.article-diagram-art .heading {font-size:1.125rem;font-weight:var(--weight-semibold,600)}
.article-diagram-art .label {font-weight:var(--weight-semibold,600)}
.article-diagram-art .note {font-size:.875rem;fill:var(--color-label,#b5b5b5)}
.article-diagram-art .box {fill:var(--color-card,#242424);stroke:var(--color-border,#555);stroke-width:1;rx:8}
.article-diagram-art .active {fill:var(--color-card,#242424);stroke:var(--color-link,#78b8ff);stroke-width:1.5;rx:8}
.article-diagram-art .edge {fill:none;stroke:var(--color-link,#78b8ff);stroke-width:1.5;marker-end:url(#arrow)}
.article-diagram-art .life {fill:none;stroke:var(--color-border,#555);stroke-width:1;stroke-dasharray:5 5}
</style>
<text x="24" y="32" text-anchor="start" class="heading">토큰 정보 + 위치 정보</text>
<rect x="24" y="66" width="272" height="80" class="box"/>
<text x="160.0" y="99.0" text-anchor="middle" class="label">토큰 임베딩 × √d_model</text>
<text x="160.0" y="123.0" text-anchor="middle" class="note">어떤 토큰인가</text>
<rect x="364" y="66" width="272" height="80" class="box"/>
<text x="500.0" y="99.0" text-anchor="middle" class="label">위치 인코딩 PE</text>
<text x="500.0" y="123.0" text-anchor="middle" class="note">몇 번째 위치인가</text>
<rect x="230" y="208" width="200" height="56" class="active"/>
<text x="330.0" y="241.0" text-anchor="middle" class="label">원소별 덧셈</text>
<path d="M160 146V184H280V208" class="edge"/>
<path d="M500 146V184H380V208" class="edge"/>
<path d="M330 264L330 304" class="edge"/>
<rect x="160" y="304" width="340" height="48" class="box"/>
<text x="330.0" y="333.0" text-anchor="middle" class="label">모델 입력 · 차원은 그대로</text>
</svg>
