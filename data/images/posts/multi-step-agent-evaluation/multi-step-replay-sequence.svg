<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Teacher-forced multi-step replay without expectation leakage</title><desc id="desc">The projector separates runtime requests from expected paths. Pinned prior actions and fixture outputs enter later requests while current expectations remain visible only to the scorer.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker><style>.t{font:700 29px system-ui;fill:#0f172a}.h{font:700 16px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}.msg{stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.ret{stroke:#0f766e;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#arrow)}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}.note{fill:#fffbeb;stroke:#b45309;stroke-width:2;rx:10}</style></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="50" y="55" class="t">Teacher-forced Multi-step Replay</text><text x="50" y="82" class="s">Current expectation is hidden, but prior history is pinned by the test case.</text>
  <rect x="55" y="115" width="190" height="58" class="box"/><text x="150" y="150" text-anchor="middle" class="h">Validated Test Case</text><rect x="345" y="115" width="190" height="58" class="box"/><text x="440" y="150" text-anchor="middle" class="h">Projector</text><rect x="655" y="115" width="190" height="58" class="box"/><text x="750" y="150" text-anchor="middle" class="h">Agent Runtime</text><rect x="955" y="115" width="190" height="58" class="box"/><text x="1050" y="150" text-anchor="middle" class="h">Scorer</text><path d="M150 173V710M440 173V710M750 173V710M1050 173V710" class="life"/>
  <line x1="150" y1="220" x2="440" y2="220" class="msg"/><text x="295" y="210" text-anchor="middle" class="s">project(case)</text><rect x="475" y="242" width="235" height="72" class="note"/><text x="592" y="268" text-anchor="middle" class="h">Split boundaries</text><text x="592" y="292" text-anchor="middle" class="s">requests[] / expectedPaths[]</text>
  <line x1="440" y1="350" x2="750" y2="350" class="msg"/><text x="595" y="340" text-anchor="middle" class="s">Step 0: user + context</text><line x1="750" y1="400" x2="440" y2="400" class="ret"/><text x="595" y="390" text-anchor="middle" class="s">actual action A (score evidence)</text><line x1="440" y1="455" x2="1050" y2="455" class="msg"/><text x="745" y="445" text-anchor="middle" class="s">actual A / expected A</text><line x1="1050" y1="495" x2="440" y2="495" class="ret"/><text x="745" y="485" text-anchor="middle" class="s">step verdict</text>
  <rect x="475" y="520" width="235" height="72" class="note"/><text x="592" y="546" text-anchor="middle" class="h">Build Step 1 history</text><text x="592" y="570" text-anchor="middle" class="s">pinned expected A + fixture output</text><line x1="440" y1="625" x2="750" y2="625" class="msg"/><text x="595" y="615" text-anchor="middle" class="s">Step 1: pinned prior history</text><line x1="750" y1="670" x2="1050" y2="670" class="msg"/><text x="900" y="660" text-anchor="middle" class="s">actual B</text><line x1="440" y1="705" x2="1050" y2="705" class="msg"/><text x="745" y="695" text-anchor="middle" class="s">expected B (scorer only)</text><text x="70" y="735" class="s">Replay invariant: current expectation is hidden; prior history is pinned, not an actual trajectory.</text>
</svg>
