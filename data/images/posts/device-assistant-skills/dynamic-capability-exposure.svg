<svg xmlns="http://www.w3.org/2000/svg" width="780" height="664" viewBox="0 0 780 664" role="img" aria-labelledby="exposure-title exposure-desc" data-article-diagram="true" class="article-diagram-art">
<title id="exposure-title">요청별 capability를 모델과 하네스에 함께 노출한다</title><desc id="exposure-desc">요청과 문맥에서 capability를 탐색한 뒤 모델의 판단 정보와 하네스의 실행 구성에 반영한다. 추가 정보가 필요하면 상세 로드하거나 다시 탐색한다.</desc>
<defs><marker id="exposure-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#8ddacb"/></marker></defs>
<style>
.article-diagram-art text { font-family:var(--font-body,sans-serif); font-size:1rem; fill:#e7edf4; }
.article-diagram-art .heading { font-size:1.125rem; font-weight:var(--weight-semibold,600); }
.article-diagram-art .label { font-weight:var(--weight-semibold,600); }
.article-diagram-art .note { font-size:.875rem; fill:#b8c4d4; }
.article-diagram-art .box { fill:#202c3b; stroke:#617287; stroke-width:1.5; }
.article-diagram-art .focus { fill:#163a37; stroke:#8ddacb; stroke-width:1.5; }
.article-diagram-art .warn { fill:#3a3023; stroke:#e3b66c; stroke-width:1.5; }
.article-diagram-art .line { fill:none; stroke:#8ddacb; stroke-width:1.5; marker-end:url(#exposure-arrow); }
</style><rect width="780" height="664" rx="12" fill="#121b26"/>
<text x="28" y="38" class="heading">요청별 capability를 모델과 하네스에 함께 노출한다</text>
<rect x="235" y="72" width="310" height="78" rx="10" class="box"/>
<text x="251" y="102" class="label" text-anchor="start">사용자 요청 + 현재 문맥</text>
<text x="251" y="130" class="note" text-anchor="start">의도 · 대화 · 관련 실행 상태</text>
<path d="M390 150V190" class="line"/>
<rect x="210" y="190" width="360" height="98" rx="10" class="focus"/>
<text x="226" y="220" class="label" text-anchor="start">capability 탐색 계층</text>
<text x="226" y="248" class="note" text-anchor="start">요청에 맞는 기능 후보와 제약</text>
<text x="226" y="270" class="note" text-anchor="start">필요한 상세 정의에 접근</text>
<path d="M300 288V323H193V358" class="line"/>
<path d="M480 288V323H587V358" class="line"/>
<text x="193" y="310" class="note" text-anchor="middle">판단에 필요한 정보</text>
<text x="587" y="310" class="note" text-anchor="middle">실행 구성에 필요한 정보</text>
<rect x="28" y="358" width="330" height="108" rx="10" class="box"/>
<text x="44" y="388" class="label" text-anchor="start">모델</text>
<text x="44" y="416" class="note" text-anchor="start">기능 설명 · Skill 후보 · 상세 절차</text>
<text x="44" y="438" class="note" text-anchor="start">선택 · 계획 · 필요한 정보 판단</text>
<rect x="422" y="358" width="330" height="108" rx="10" class="box"/>
<text x="438" y="388" class="label" text-anchor="start">하네스</text>
<text x="438" y="416" class="note" text-anchor="start">기능 분류 · 도구 정의 · 연결 정보</text>
<text x="438" y="438" class="note" text-anchor="start">프롬프트 조립 · 호출 도구 구성</text>
<path d="M193 466V498H350V529" class="line"/>
<path d="M587 466V498H430V529" class="line"/>
<rect x="210" y="529" width="360" height="77" rx="10" class="box"/>
<text x="226" y="559" class="label" text-anchor="start">실행과 결과 확인</text>
<text x="226" y="587" class="note" text-anchor="start">입력·권한 검증은 실행 계약에 따라 수행</text>
<text x="28" y="640" class="note" text-anchor="start">정보가 부족하면 상세 로드·후속 탐색을 거쳐 다음 판단을 이어 간다.</text>
</svg>
