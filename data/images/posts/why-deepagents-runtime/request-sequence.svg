<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1150" viewBox="0 0 1120 1150" role="img" aria-labelledby="title desc" data-article-diagram="true" class="article-diagram-art">
<title id="title">날씨 조회: 도구 호출 요청과 결과 메시지</title><desc id="desc">사용자 질문을 받은 모델이 날씨 도구 호출을 요청한다. 애플리케이션이 외부 도구를 실행하고 같은 호출 ID의 ToolMessage를 전달하면 모델이 결과를 읽어 답변한다. 도구 이름과 값은 독립적으로 만든 설명용 예시다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="var(--color-link,#78b8ff)"/></marker></defs>
<style>
.article-diagram-art{font-family:var(--font-body,sans-serif);font-size:16px}
.article-diagram-art text{fill:var(--color-heading,#eee);font-family:var(--font-body,sans-serif);font-size:1rem}
.article-diagram-art .heading{font-size:1.125rem;font-weight:var(--weight-semibold,600)}
.article-diagram-art .label{font-weight:var(--weight-semibold,600)}
.article-diagram-art .note{font-size:.875rem;fill:var(--color-label,#b5b5b5)}
.article-diagram-art .box{fill:var(--color-card,#242424);stroke:var(--color-border,#555);stroke-width:1;rx:8}
.article-diagram-art .active{fill:var(--color-card,#242424);stroke:var(--color-link,#78b8ff);stroke-width:1.5;rx:8}
.article-diagram-art .edge{fill:none;stroke:var(--color-link,#78b8ff);stroke-width:1.5;marker-end:url(#arrow)}
.article-diagram-art .life{fill:none;stroke:var(--color-border,#555);stroke-width:1;stroke-dasharray:5 5}
</style>
<text x="24" y="32" class="heading" text-anchor="start">날씨 조회: 도구 호출 요청 → 실행 결과 → 최종 답변</text>
<text x="24" y="57" class="note" text-anchor="start">외부 도구를 애플리케이션이 실행하는 구성 예시</text>
<path d="M120 148V1060" class="life"/>
<rect x="30" y="82" width="180" height="66" class="box"/>
<text x="120" y="109" class="label" text-anchor="middle">사용자</text>
<text x="120" y="134" class="note" text-anchor="middle">질문과 답변</text>
<path d="M400 148V1060" class="life"/>
<rect x="310" y="82" width="180" height="66" class="box"/>
<text x="400" y="109" class="label" text-anchor="middle">애플리케이션</text>
<text x="400" y="134" class="note" text-anchor="middle">실행 판단 · 결과 전달</text>
<path d="M700 148V1060" class="life"/>
<rect x="610" y="82" width="180" height="66" class="box"/>
<text x="700" y="109" class="label" text-anchor="middle">Deep Agents</text>
<text x="700" y="134" class="note" text-anchor="middle">모델 포함</text>
<path d="M990 148V1060" class="life"/>
<rect x="900" y="82" width="180" height="66" class="box"/>
<text x="990" y="109" class="label" text-anchor="middle">외부 도구</text>
<text x="990" y="134" class="note" text-anchor="middle">설명용 날씨 조회</text>
<path d="M120 190H400" class="edge"/>
<text x="260.0" y="177" class="note" text-anchor="middle">① “서울 날씨 알려줘”</text>
<path d="M400 245H700" class="edge"/>
<text x="550.0" y="232" class="note" text-anchor="middle">HumanMessage + 스킬</text>
<path d="M700 305H400" class="edge"/>
<text x="550.0" y="292" class="note" text-anchor="middle">② AIMessage · 도구 호출 요청</text>
<rect x="430" y="326" width="560" height="172" class="active"/>
<text x="450" y="352" class="label" text-anchor="start">모델이 요청한 도구와 입력값</text>
<text x="450" y="380" class="" text-anchor="start">tool_calls: [{</text>
<text x="450" y="402" class="" text-anchor="start">  name: &quot;demo_weather&quot;,</text>
<text x="450" y="424" class="" text-anchor="start">  args: { city: &quot;서울&quot; },</text>
<text x="450" y="446" class="" text-anchor="start">  id: &quot;demo_weather_1&quot;</text>
<text x="450" y="468" class="" text-anchor="start">}]</text>
<path d="M400 540H990" class="edge"/>
<text x="695.0" y="527" class="note" text-anchor="middle">③ 실행 허용 여부 확인 후 날씨 조회</text>
<path d="M990 600H400" class="edge"/>
<text x="695.0" y="587" class="note" text-anchor="middle">④ 조회 결과: 맑음, 22°C</text>
<path d="M400 660H700" class="edge"/>
<text x="550.0" y="647" class="note" text-anchor="middle">⑤ ToolMessage + 기존 대화</text>
<rect x="430" y="680" width="560" height="138" class="active"/>
<text x="450" y="707" class="label" text-anchor="start">호출 ID로 요청과 결과를 연결</text>
<text x="450" y="737" class="" text-anchor="start">tool_call_id: &quot;demo_weather_1&quot;</text>
<text x="450" y="763" class="" text-anchor="start">name: &quot;demo_weather&quot;</text>
<text x="450" y="789" class="" text-anchor="start">content: &quot;서울: 맑음, 22°C&quot;</text>
<path d="M700 880H400" class="edge"/>
<text x="550.0" y="867" class="note" text-anchor="middle">⑥ AIMessage · 결과를 읽고 답변 생성</text>
<rect x="165" y="900" width="570" height="70" class="box"/>
<text x="190" y="929" class="label" text-anchor="start">최종 답변</text>
<text x="190" y="954" class="" text-anchor="start">content: &quot;서울은 맑고 22°C예요.&quot;</text>
<path d="M400 1020H120" class="edge"/>
<text x="260.0" y="1007" class="note" text-anchor="middle">⑦ 답변 전달 (SSE)</text>
<text x="560" y="1098" class="note" text-anchor="middle">도구 이름·호출 ID·날씨 값은 설명용 예시 · 메시지는 주요 필드만 표시</text>
<text x="560" y="1125" class="note" text-anchor="middle">모델 호출·상태 저장·중간 스트리밍은 단순화</text>
</svg>
