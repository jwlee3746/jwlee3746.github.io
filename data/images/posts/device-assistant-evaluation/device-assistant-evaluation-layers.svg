<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Layered device assistant evaluation strategy</title>
  <desc id="desc">Contract tests, decision replay, stateful simulation, service sandbox, hardware-in-the-loop, and online observation form a layered evaluation strategy.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:16px system-ui,sans-serif;fill:#64748b}.level{font:700 18px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.blue{fill:#eff6ff;stroke:#2563eb}.cyan{fill:#ecfeff;stroke:#0f766e}.amber{fill:#fffbeb;stroke:#b45309}.violet{fill:#f5f3ff;stroke:#7c3aed}.red{fill:#fef2f2;stroke:#dc2626}.line{stroke:#475569;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.feedback{stroke:#7c3aed;stroke-width:2.4;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="55" y="56" class="title">Layered Evaluation for Device Assistants</text>
  <text x="55" y="86" class="sub">넓고 빠른 regression 기반 위에 현실성과 비용이 높은 검증을 선택적으로 쌓는다.</text>

  <text x="55" y="137" class="level">FAST · DETERMINISTIC</text><text x="1140" y="137" text-anchor="end" class="tiny">넓은 coverage / 낮은 실행 비용</text>

  <rect x="105" y="160" width="990" height="72" class="box blue"/><text x="145" y="190" class="level">1 · Contract Tests</text><text x="145" y="216" class="small">schema · deterministic state machine · grader self-tests</text><text x="1045" y="202" text-anchor="end" class="small">every change</text>
  <rect x="165" y="255" width="870" height="72" class="box amber"/><text x="205" y="285" class="level">2 · Decision Replay</text><text x="205" y="311" class="small">versioned context · known regressions · structured path scoring</text><text x="985" y="297" text-anchor="end" class="small">PR / continuous</text>
  <rect x="225" y="350" width="750" height="72" class="box cyan"/><text x="265" y="380" class="level">3 · Stateful Simulator</text><text x="265" y="406" class="small">dynamic selection · confirmation · recovery · race conditions</text><text x="925" y="392" text-anchor="end" class="small">scheduled</text>
  <rect x="285" y="445" width="630" height="72" class="box violet"/><text x="325" y="475" class="level">4 · Service Sandbox</text><text x="325" y="501" class="small">real APIs · isolated state · queues · repeated trials</text><text x="865" y="487" text-anchor="end" class="small">release</text>
  <rect x="345" y="540" width="510" height="72" class="box red"/><text x="385" y="570" class="level">5 · Hardware-in-the-Loop</text><text x="385" y="596" class="small">OS · app · actuator · independent cleanup</text><text x="805" y="582" text-anchor="end" class="small">sentinel suite</text>

  <path d="M600 232V255" class="line"/><path d="M600 327V350" class="line"/><path d="M600 422V445" class="line"/><path d="M600 517V540" class="line"/>

  <rect x="330" y="650" width="540" height="48" rx="14" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2"/><text x="600" y="680" text-anchor="middle" class="level">6 · Online Observation &amp; Human Review</text>
  <path d="M600 612V650" class="line"/>
  <path d="M330 674H70V196H105" class="feedback"/>
  <text x="55" y="706" class="tiny">REAL DISTRIBUTION · 실제 실패는 다시 synthetic task와 regression asset으로 환류한다.</text>
</svg>
