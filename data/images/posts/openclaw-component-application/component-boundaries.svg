<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw component responsibilities in the server-side agent proof of concept</title>
  <desc id="desc">A request enters a session. Skills guide capability selection, a typed custom tool executes the external function, hooks add metadata and observability, and the normalized result returns to the model.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:16px system-ui,sans-serif;fill:#64748b}.label{font:700 19px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.blue{fill:#eff6ff;stroke:#2563eb}.cyan{fill:#ecfeff;stroke:#0f766e}.amber{fill:#fffbeb;stroke:#b45309}.violet{fill:#f5f3ff;stroke:#7c3aed}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="#f8fafc"/>
  <text x="55" y="58" class="title">PoC에서 나눈 컴포넌트의 책임</text>
  <text x="55" y="88" class="sub">Skill은 판단, Tool은 행동, Hook은 횡단 정책, Session은 대화 연속성을 맡는다.</text>

  <rect x="55" y="155" width="185" height="130" class="box blue"/>
  <text x="147" y="198" text-anchor="middle" class="label">사용자 요청</text>
  <text x="147" y="235" text-anchor="middle" class="small">후속 답변 · 예약 요청</text>
  <text x="147" y="260" text-anchor="middle" class="tiny">inbound identity</text>

  <rect x="315" y="135" width="235" height="170" class="box cyan"/>
  <text x="432" y="178" text-anchor="middle" class="label">Gateway / Session</text>
  <text x="432" y="218" text-anchor="middle" class="small">사용자·서비스 routing</text>
  <text x="432" y="250" text-anchor="middle" class="small">history와 실행 직렬화</text>
  <text x="432" y="280" text-anchor="middle" class="tiny">대화 연속성</text>

  <rect x="625" y="135" width="235" height="170" class="box violet"/>
  <text x="742" y="178" text-anchor="middle" class="label">Workspace + Skill</text>
  <text x="742" y="218" text-anchor="middle" class="small">capability scope 확인</text>
  <text x="742" y="250" text-anchor="middle" class="small">target과 query 결정</text>
  <text x="742" y="280" text-anchor="middle" class="tiny">판단 계약</text>

  <rect x="935" y="135" width="210" height="170" class="box amber"/>
  <text x="1040" y="178" text-anchor="middle" class="label">Custom Tool</text>
  <text x="1040" y="218" text-anchor="middle" class="small">typed input</text>
  <text x="1040" y="250" text-anchor="middle" class="small">외부 기능 실행</text>
  <text x="1040" y="280" text-anchor="middle" class="tiny">행동 계약</text>

  <path d="M240 220H315" class="line"/><path d="M550 220H625" class="line"/><path d="M860 220H935" class="line"/>

  <rect x="315" y="405" width="235" height="155" class="box violet"/>
  <text x="432" y="447" text-anchor="middle" class="label">Plugin Hook</text>
  <text x="432" y="485" text-anchor="middle" class="small">metadata 보정</text>
  <text x="432" y="517" text-anchor="middle" class="small">latency · 결과 logging</text>
  <text x="432" y="543" text-anchor="middle" class="tiny">횡단 관심사</text>

  <rect x="625" y="405" width="235" height="155" class="box amber"/>
  <text x="742" y="447" text-anchor="middle" class="label">응답 정규화</text>
  <text x="742" y="485" text-anchor="middle" class="small">event allowlist</text>
  <text x="742" y="517" text-anchor="middle" class="small">payload 제거 · 오류 격리</text>
  <text x="742" y="543" text-anchor="middle" class="tiny">model-visible contract</text>

  <rect x="935" y="405" width="210" height="155" class="box blue"/>
  <text x="1040" y="447" text-anchor="middle" class="label">외부 기능</text>
  <text x="1040" y="485" text-anchor="middle" class="small">검색 · 메시지 · 일정</text>
  <text x="1040" y="517" text-anchor="middle" class="small">디바이스 제어</text>

  <path d="M1040 305V405" class="line"/><path d="M935 482H860" class="line"/><path d="M625 482H550" class="line"/>
  <path d="M432 405V305" class="dash"/>
  <text x="55" y="640" class="sub">Automation은 예약 시점에 Session을 다시 깨우고, 같은 판단 → 실행 → 정규화 경로를 재사용한다.</text>
</svg>
