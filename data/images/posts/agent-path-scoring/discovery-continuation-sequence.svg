<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730" role="img" aria-labelledby="title desc">
  <title id="title">Discovery continuation sequence</title><desc id="desc">The evaluator continues returned runtime state until a downstream action can be scored within budget.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker><style>.t{font:700 29px system-ui;fill:#0f172a}.h{font:700 16px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}.msg{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}.ret{stroke:#0f766e;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#a)}.alt{fill:#fffbeb;stroke:#b45309;stroke-width:2;rx:10}</style></defs>
  <rect width="1200" height="730" rx="24" fill="#f8fafc"/><text x="50" y="55" class="t">Discovery Continuation — Sequence Diagram</text><text x="50" y="82" class="s">Evaluator continues returned runtime state; it does not resolve capabilities itself.</text>
  <rect x="55" y="110" width="190" height="58" class="box"/><text x="150" y="145" text-anchor="middle" class="h">Evaluator</text><rect x="345" y="110" width="210" height="58" class="box"/><text x="450" y="145" text-anchor="middle" class="h">Agent Runtime</text><rect x="665" y="110" width="210" height="58" class="box"/><text x="770" y="145" text-anchor="middle" class="h">Capability Registry</text><rect x="965" y="110" width="180" height="58" class="box"/><text x="1055" y="145" text-anchor="middle" class="h">Action Tool</text><path d="M150 168V680M450 168V680M770 168V680M1055 168V680" class="life"/>
  <line x1="150" y1="220" x2="450" y2="220" class="msg"/><text x="300" y="210" text-anchor="middle" class="s">expected-step request</text><line x1="450" y1="270" x2="770" y2="270" class="msg"/><text x="610" y="260" text-anchor="middle" class="s">discover capability</text><line x1="770" y1="315" x2="450" y2="315" class="ret"/><text x="610" y="305" text-anchor="middle" class="s">resolved result + snapshot</text><line x1="450" y1="365" x2="150" y2="365" class="ret"/><text x="300" y="355" text-anchor="middle" class="s">discovery-only response + resolved state</text>
  <rect x="95" y="405" width="410" height="74" class="alt"/><text x="300" y="433" text-anchor="middle" class="h">Within continuation budget?</text><text x="300" y="458" text-anchor="middle" class="s">state complete · no mixed action · expected mode</text><line x1="150" y1="515" x2="450" y2="515" class="msg"/><text x="300" y="505" text-anchor="middle" class="s">returned messages + snapshot</text><line x1="450" y1="565" x2="1055" y2="565" class="msg"/><text x="752" y="555" text-anchor="middle" class="s">downstream action</text><line x1="1055" y1="610" x2="450" y2="610" class="ret"/><text x="752" y="600" text-anchor="middle" class="s">action result</text><line x1="450" y1="655" x2="150" y2="655" class="ret"/><text x="300" y="645" text-anchor="middle" class="s">structured final action → score</text><text x="55" y="705" class="s">Stop conditions: mixed call · missing resolved state · wrong non-discovery action · budget exhausted.</text>
</svg>
