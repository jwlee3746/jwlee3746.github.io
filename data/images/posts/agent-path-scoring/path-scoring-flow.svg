<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc">
  <title id="title">One actual trial scored against preferred and alternative paths</title><desc id="desc">A single actual trajectory is compared with the preferred oracle and then alternative oracles without rerunning the agent.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker><style>.t{font:700 29px system-ui;fill:#0f172a}.h{font:700 17px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:14}.blue{fill:#eff6ff;stroke:#2563eb}.teal{fill:#ecfeff;stroke:#0f766e}.red{fill:#fef2f2;stroke:#b91c1c}.line{stroke:#475569;stroke-width:2.4;fill:none;marker-end:url(#a)}.yes{font:700 13px system-ui;fill:#0f766e}.no{font:700 13px system-ui;fill:#b91c1c}</style></defs>
  <rect width="1200" height="780" rx="24" fill="#f8fafc"/><text x="50" y="55" class="t">One Trial → Multiple Allowed Oracles</text><text x="50" y="83" class="s">Alternatives accept multiple correct outcomes without giving the agent additional attempts.</text>
  <rect x="455" y="110" width="290" height="70" class="box blue"/><text x="600" y="140" text-anchor="middle" class="h">Actual Trial + Allowed Oracles</text><text x="600" y="163" text-anchor="middle" class="s">one trajectory only</text><path d="M600 180V225" class="line"/><rect x="455" y="225" width="290" height="70" class="box"/><text x="600" y="255" text-anchor="middle" class="h">Score Current Oracle</text><text x="600" y="280" text-anchor="middle" class="s">preferred first, then alternatives</text><path d="M600 295V337" class="line"/><path d="M600 337 720 410 600 483 480 410Z" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="600" y="405" text-anchor="middle" class="h">Actual evidence</text><text x="600" y="429" text-anchor="middle" class="s">matches oracle?</text>
  <path d="M720 410H920V475" class="line"/><text x="805" y="397" class="yes">YES</text><rect x="805" y="475" width="230" height="78" class="box teal"/><text x="920" y="510" text-anchor="middle" class="h">PASS</text><text x="920" y="535" text-anchor="middle" class="s">matched oracle</text><path d="M600 483V535" class="line"/><text x="616" y="515" class="no">NO</text><rect x="455" y="535" width="290" height="75" class="box blue"/><text x="600" y="566" text-anchor="middle" class="h">Select Next Alternative</text><text x="600" y="590" text-anchor="middle" class="s">reuse the same actual trajectory</text>
  <path d="M455 572H335V455" class="line"/><path d="M335 310 440 377 335 444 230 377Z" fill="#fffbeb" stroke="#b45309" stroke-width="2"/><text x="335" y="372" text-anchor="middle" class="h">Any alternative</text><text x="335" y="396" text-anchor="middle" class="s">left?</text><path d="M335 310V250H455" class="line"/><text x="350" y="287" class="yes">YES</text><path d="M230 377H105V500" class="line"/><text x="168" y="364" class="no">NO</text><rect x="55" y="500" width="230" height="100" class="box red"/><text x="170" y="537" text-anchor="middle" class="h">FAIL</text><text x="170" y="563" text-anchor="middle" class="s">preserve path verdict</text><text x="170" y="585" text-anchor="middle" class="s">and failure category</text>
  <rect x="820" y="640" width="325" height="95" class="box"/><text x="982" y="672" text-anchor="middle" class="h">Typical match fields</text><text x="982" y="700" text-anchor="middle" class="s">agent · tool · function · parameters</text><text x="982" y="722" text-anchor="middle" class="s">path order · skill dimension</text><text x="55" y="735" class="s">LLM judge is optional and follows structured path success; it does not override a wrong tool path.</text>
</svg>
