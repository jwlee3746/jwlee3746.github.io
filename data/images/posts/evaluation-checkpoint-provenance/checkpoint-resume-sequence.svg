<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Checkpoint and resume sequence</title><desc id="desc">A runner dispatches work, periodically writes atomic checkpoints, drains in-flight work after a stop signal, then validates compatibility and resumes pending executions.</desc>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker><style>.t{font:700 29px system-ui;fill:#0f172a}.h{font:700 16px system-ui;fill:#0f172a}.s{font:14px system-ui;fill:#475569}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:12}.life{stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 6}.msg{stroke:#475569;stroke-width:2.3;marker-end:url(#a)}.ret{stroke:#0f766e;stroke-width:2.3;stroke-dasharray:7 5;marker-end:url(#a)}.note{fill:#fffbeb;stroke:#b45309;stroke-width:2;rx:10}</style></defs>
  <rect width="1200" height="760" rx="24" fill="#f8fafc"/><text x="50" y="55" class="t">Checkpoint, Graceful Stop &amp; Resume</text><text x="50" y="82" class="s">Periodic durability plus compatibility-checked result reuse.</text>
  <rect x="70" y="110" width="190" height="58" class="box"/><text x="165" y="145" text-anchor="middle" class="h">Operator</text><rect x="365" y="110" width="190" height="58" class="box"/><text x="460" y="145" text-anchor="middle" class="h">Evaluation Runner</text><rect x="665" y="110" width="190" height="58" class="box"/><text x="760" y="145" text-anchor="middle" class="h">Worker Pool</text><rect x="955" y="110" width="190" height="58" class="box"/><text x="1050" y="145" text-anchor="middle" class="h">Atomic Store</text><path d="M165 168V710M460 168V710M760 168V710M1050 168V710" class="life"/>
  <line x1="165" y1="215" x2="460" y2="215" class="msg"/><text x="312" y="205" text-anchor="middle" class="s">start run(policy, selection)</text><line x1="460" y1="260" x2="760" y2="260" class="msg"/><text x="610" y="250" text-anchor="middle" class="s">dispatch bounded work</text><line x1="760" y1="305" x2="460" y2="305" class="ret"/><text x="610" y="295" text-anchor="middle" class="s">settled executions</text><line x1="460" y1="350" x2="1050" y2="350" class="msg"/><text x="755" y="340" text-anchor="middle" class="s">periodic atomic checkpoint</text><line x1="165" y1="410" x2="460" y2="410" class="msg"/><text x="312" y="400" text-anchor="middle" class="s">stop signal</text>
  <rect x="395" y="435" width="300" height="68" class="note"/><text x="545" y="462" text-anchor="middle" class="h">Stop new dispatch</text><text x="545" y="486" text-anchor="middle" class="s">wait for in-flight work to settle</text><line x1="760" y1="540" x2="460" y2="540" class="ret"/><text x="610" y="530" text-anchor="middle" class="s">final settled results</text><line x1="460" y1="580" x2="1050" y2="580" class="msg"/><text x="755" y="570" text-anchor="middle" class="s">interrupted checkpoint</text><line x1="165" y1="625" x2="460" y2="625" class="msg"/><text x="312" y="615" text-anchor="middle" class="s">resume from artifact</text><line x1="460" y1="665" x2="1050" y2="665" class="msg"/><text x="755" y="655" text-anchor="middle" class="s">verify policy + execution identities</text><line x1="460" y1="705" x2="760" y2="705" class="msg"/><text x="610" y="695" text-anchor="middle" class="s">dispatch pending only</text><text x="55" y="742" class="s">Execution identity includes a projected-plan digest, preventing stale result reuse after input or expectation changes.</text>
</svg>
