<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">OpenClaw runtime component map</title>
  <desc id="desc">Clients connect to the Gateway, which owns sessions and runs the agent loop. Workspace skills shape decisions, plugins provide tools and hooks, and automations wake later runs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:16px system-ui,sans-serif;fill:#64748b}.label{font:700 19px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.tiny{font:13px system-ui,sans-serif;fill:#64748b}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.blue{fill:#eff6ff;stroke:#2563eb}.cyan{fill:#ecfeff;stroke:#0f766e}.amber{fill:#fffbeb;stroke:#b45309}.violet{fill:#f5f3ff;stroke:#7c3aed}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}.dash{stroke:#7c3aed;stroke-width:2.2;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="720" rx="24" fill="#f8fafc"/>
  <text x="55" y="58" class="title">OpenClaw Runtime — Component Boundaries</text>
  <text x="55" y="88" class="sub">Gateway가 상태와 실행을 소유하고, Skill은 판단을 안내하며, Tool·Plugin은 실제 행동을 확장한다.</text>

  <rect x="50" y="155" width="205" height="245" class="box blue"/>
  <text x="152" y="193" text-anchor="middle" class="label">Clients / Nodes</text>
  <text x="152" y="239" text-anchor="middle" class="small">Web · CLI · App</text>
  <text x="152" y="275" text-anchor="middle" class="small">Messaging channels</text>
  <text x="152" y="311" text-anchor="middle" class="small">Device nodes</text>
  <text x="152" y="358" text-anchor="middle" class="tiny">typed WebSocket API</text>

  <rect x="330" y="125" width="530" height="420" class="box cyan"/>
  <text x="595" y="168" text-anchor="middle" class="label">Gateway</text>
  <text x="595" y="195" text-anchor="middle" class="small">routing · session state · queues · streaming · persistence</text>

  <rect x="370" y="235" width="205" height="225" class="box amber"/>
  <text x="472" y="275" text-anchor="middle" class="label">Session Lane</text>
  <text x="472" y="315" text-anchor="middle" class="small">session key / history</text>
  <text x="472" y="349" text-anchor="middle" class="small">serialized runs</text>
  <text x="472" y="383" text-anchor="middle" class="small">context + compaction</text>
  <text x="472" y="425" text-anchor="middle" class="tiny">continuity boundary</text>

  <rect x="625" y="235" width="195" height="225" class="box violet"/>
  <text x="722" y="275" text-anchor="middle" class="label">Agent Loop</text>
  <text x="722" y="315" text-anchor="middle" class="small">prompt assembly</text>
  <text x="722" y="349" text-anchor="middle" class="small">model inference</text>
  <text x="722" y="383" text-anchor="middle" class="small">tool execution</text>
  <text x="722" y="417" text-anchor="middle" class="small">reply + persistence</text>
  <path d="M575 347H625" class="line"/>

  <rect x="930" y="120" width="220" height="135" class="box blue"/>
  <text x="1040" y="158" text-anchor="middle" class="label">Workspace</text>
  <text x="1040" y="196" text-anchor="middle" class="small">AGENTS.md · context</text>
  <text x="1040" y="226" text-anchor="middle" class="small">Skills / SKILL.md</text>
  <path d="M930 205H860" class="line"/>

  <rect x="930" y="320" width="220" height="180" class="box amber"/>
  <text x="1040" y="360" text-anchor="middle" class="label">Capability Layer</text>
  <text x="1040" y="399" text-anchor="middle" class="small">typed Tools</text>
  <text x="1040" y="432" text-anchor="middle" class="small">Plugins · Hooks</text>
  <text x="1040" y="465" text-anchor="middle" class="small">external systems</text>
  <path d="M820 383H930" class="line"/>

  <rect x="330" y="615" width="530" height="65" class="box violet"/>
  <text x="595" y="643" text-anchor="middle" class="label">Automations</text>
  <text x="595" y="666" text-anchor="middle" class="small">schedule · wake · background run · delivery</text>
  <path d="M595 615V545" class="dash"/>
  <path d="M255 277H330" class="line"/>
  <text x="55" y="698" class="sub">정책 경계는 별개다: sandbox는 어디서 실행할지, tool policy는 무엇을 호출할지 결정한다.</text>
</svg>
