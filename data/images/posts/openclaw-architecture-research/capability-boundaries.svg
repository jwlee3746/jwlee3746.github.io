<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
<title id="title">03 / 확장 책임의 경계</title><desc id="desc">Skill은 판단 절차를 제공하고 Plugin은 Tool과 Hook을 등록한다. Agent loop가 Hook을 거쳐 Tool을 호출하며 Tool이 외부 API와 통신한다. Skill 자체가 API를 실행하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b42}.heading{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:23px}.note{font-size:21px;fill:#475569}.edge{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.return{stroke-dasharray:7 5}.life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 6}</style>
<rect width="640" height="640" rx="18" fill="#f8fafc"/>
<text x="28" y="44" class="heading" text-anchor="start">03 / 확장 책임의 경계</text>
<rect x="24" y="82" width="272" height="116" rx="12" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2"/>
<text x="160.0" y="116" class="label" text-anchor="middle">Skill / SKILL.md</text>
<text x="160.0" y="150" class="body" text-anchor="middle">언제 · 어떤 순서로</text>
<text x="160.0" y="180" class="body" text-anchor="middle">도구를 사용할지</text>
<rect x="344" y="82" width="272" height="116" rx="12" fill="#eaf3ff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480.0" y="116" class="label" text-anchor="middle">Plugin</text>
<text x="480.0" y="150" class="body" text-anchor="middle">Tool · Hook 등록</text>
<text x="480.0" y="180" class="body" text-anchor="middle">설정 · 배포 단위</text>
<path d="M160 198V276" class="edge"/>
<text x="170" y="240" class="note" text-anchor="start">지침</text>
<path d="M480 198V276" class="edge"/>
<text x="492" y="240" class="note" text-anchor="start">등록</text>
<rect x="24" y="276" width="272" height="116" rx="12" fill="#f1edff" stroke="#cbd5e1" stroke-width="2"/>
<text x="160.0" y="310" class="label" text-anchor="middle">Agent loop</text>
<text x="160.0" y="344" class="body" text-anchor="middle">model의 도구 선택</text>
<text x="160.0" y="374" class="body" text-anchor="middle">결과를 다음 추론에 반영</text>
<rect x="344" y="276" width="272" height="116" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2"/>
<text x="480.0" y="310" class="label" text-anchor="middle">Tool + Hooks</text>
<text x="480.0" y="344" class="body" text-anchor="middle">호출 전후 개입</text>
<text x="480.0" y="374" class="body" text-anchor="middle">typed input → 실행</text>
<path d="M296 320H344" class="edge"/>
<path d="M344 358H296" class="edge return"/>
<path d="M480 392V468" class="edge"/>
<rect x="344" y="468" width="272" height="104" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2"/>
<text x="480.0" y="502" class="label" text-anchor="middle">External API</text>
<text x="480.0" y="536" class="body" text-anchor="middle">날씨 · 검색 · 업무 기능</text>
<text x="28" y="612" class="note" text-anchor="start">Skill = 판단 절차   Tool = 행동   Plugin = 등록</text>
</svg>
