<svg xmlns="http://www.w3.org/2000/svg" data-article-diagram="true" class="article-diagram-art" width="560" height="480" viewBox="0 0 560 480" role="img" aria-labelledby="title desc">
<title id="title">03 / 확장 책임의 경계</title><desc id="desc">Skill은 판단 절차를 제공하고 Plugin은 Tool과 Hook을 등록한다. Agent loop가 Hook을 거쳐 Tool을 호출하며 Tool이 외부 API와 통신한다. Skill 자체가 API를 실행하지 않는다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569" /></marker></defs>
<style>.article-diagram-art text{font-family:"Source Sans Pro","Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#172b42}.article-diagram-art .heading{font-size:18px;font-weight:600}.article-diagram-art .label{font-size:16px;font-weight:600}.article-diagram-art .body{font-size:16px}.article-diagram-art .note{font-size:14px;fill:#475569}.article-diagram-art .edge{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.article-diagram-art .return{stroke-dasharray:7 5}.article-diagram-art .life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 6}</style>
<rect width="560" height="480" rx="18" fill="#f8fafc" />
<text x="24.5" y="33" class="heading" text-anchor="start">03 / 확장 책임의 경계</text>
<rect x="21" y="61.5" width="238" height="87" rx="12" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2" />
<text x="140" y="87" class="label" text-anchor="middle">Skill / SKILL.md</text>
<text x="140" y="112.5" class="body" text-anchor="middle">언제 · 어떤 순서로</text>
<text x="140" y="135" class="body" text-anchor="middle">도구를 사용할지</text>
<rect x="301" y="61.5" width="238" height="87" rx="12" fill="#eaf3ff" stroke="#cbd5e1" stroke-width="2" />
<text x="420" y="87" class="label" text-anchor="middle">Plugin</text>
<text x="420" y="112.5" class="body" text-anchor="middle">Tool · Hook 등록</text>
<text x="420" y="135" class="body" text-anchor="middle">설정 · 배포 단위</text>
<path d="M140 148.5V207" class="edge" />
<text x="148.75" y="180" class="note" text-anchor="start">지침</text>
<path d="M420 148.5V207" class="edge" />
<text x="430.5" y="180" class="note" text-anchor="start">등록</text>
<rect x="21" y="207" width="238" height="87" rx="12" fill="#f1edff" stroke="#cbd5e1" stroke-width="2" />
<text x="140" y="232.5" class="label" text-anchor="middle">Agent loop</text>
<text x="140" y="258" class="body" text-anchor="middle">model의 도구 선택</text>
<text x="140" y="280.5" class="body" text-anchor="middle">결과를 다음 추론에 반영</text>
<rect x="301" y="207" width="238" height="87" rx="12" fill="#ecfdf5" stroke="#cbd5e1" stroke-width="2" />
<text x="420" y="232.5" class="label" text-anchor="middle">Tool + Hooks</text>
<text x="420" y="258" class="body" text-anchor="middle">호출 전후 개입</text>
<text x="420" y="280.5" class="body" text-anchor="middle">typed input → 실행</text>
<path d="M259 240H301" class="edge" />
<path d="M301 268.5H259" class="edge return" />
<path d="M420 294V351" class="edge" />
<rect x="301" y="351" width="238" height="78" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="2" />
<text x="420" y="376.5" class="label" text-anchor="middle">External API</text>
<text x="420" y="402" class="body" text-anchor="middle">날씨 · 검색 · 업무 기능</text>
<text x="24.5" y="459" class="note" text-anchor="start">Skill = 판단 절차   Tool = 행동   Plugin = 등록</text>
</svg>
