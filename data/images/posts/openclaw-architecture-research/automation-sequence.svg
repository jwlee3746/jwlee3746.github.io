<text x="24.5" y="519.75" class="note" text-anchor="start">개념 순서도: session 방식·delivery 설정에 따라 달라짐</text>
<text x="24.5" y="542.25" class="note" text-anchor="start">작업 성공과 알림 도착은 별도의 관측 대상</text>
