<svg xmlns="http://www.w3.org/2000/svg" data-article-diagram="true" class="article-diagram-art" width="560" height="562.5" viewBox="0 0 560 562.5" role="img" aria-labelledby="title desc">
<title id="title">04 / 예약 실행과 결과 전달</title><desc id="desc">Gateway 안의 scheduler가 예약 상태를 보존하고 실행 시점에 agent run을 요청한다. Agent가 도구를 사용해 판단하고 실행 결과와 전달 결과는 별도로 관측한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569" /></marker></defs>
<style>.article-diagram-art text{font-family:"Source Sans Pro","Pretendard Variable",Pretendard,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;fill:#172b42}.article-diagram-art .heading{font-size:18px;font-weight:600}.article-diagram-art .label{font-size:16px;font-weight:600}.article-diagram-art .body{font-size:16px}.article-diagram-art .note{font-size:14px;fill:#475569}.article-diagram-art .edge{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.article-diagram-art .return{stroke-dasharray:7 5}.article-diagram-art .life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 6}</style>
<rect width="560" height="562.5" rx="18" fill="#f8fafc" />
<text x="24.5" y="33" class="heading" text-anchor="start">04 / 예약 실행과 결과 전달</text>
<rect x="31.5" y="58.5" width="115.5" height="41.25" rx="12" fill="#eaf3ff" stroke="#90b5de" stroke-width="2" />
<text x="89.25" y="84" class="label" text-anchor="middle">Scheduler</text>
<path d="M89.25 99.75V481.5" class="life" />
<rect x="222.25" y="58.5" width="115.5" height="41.25" rx="12" fill="#eaf3ff" stroke="#90b5de" stroke-width="2" />
<text x="280" y="84" class="label" text-anchor="middle">Agent run</text>
<path d="M280 99.75V481.5" class="life" />
<rect x="413" y="58.5" width="115.5" height="41.25" rx="12" fill="#eaf3ff" stroke="#90b5de" stroke-width="2" />
<text x="470.75" y="84" class="label" text-anchor="middle">Delivery</text>
<path d="M470.75 99.75V481.5" class="life" />
<rect x="24.5" y="124.5" width="129.5" height="67.5" rx="12" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2" />
<text x="89.25" y="150" class="label" text-anchor="middle">Job 상태</text>
<text x="89.25" y="175.5" class="body" text-anchor="middle">시점 · 대상</text>
<text x="184.625" y="223.5" class="body" text-anchor="middle">1. 시점 도달 → 실행</text>
<path d="M89.25 232.5H280" class="edge" />
<rect x="193.375" y="262.5" width="173.25" height="78" rx="12" fill="#f1edff" stroke="#cbd5e1" stroke-width="2" />
<text x="280" y="288" class="label" text-anchor="middle">판단 · 도구 호출</text>
<text x="280" y="313.5" class="body" text-anchor="middle">조건 확인 / 작업</text>
<text x="184.625" y="370.5" class="body" text-anchor="middle">2. 실행 결과</text>
<path d="M280 379.5H89.25" class="edge return" />
<text x="280" y="414.75" class="body" text-anchor="middle">3. 설정한 경로로 결과 전달</text>
<path d="M89.25 423.75H470.75" class="edge" />
<text x="280" y="461.25" class="body" text-anchor="middle">4. 전달 결과</text>
