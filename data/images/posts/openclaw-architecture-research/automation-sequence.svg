<svg xmlns="http://www.w3.org/2000/svg" width="640" height="750" viewBox="0 0 640 750" role="img" aria-labelledby="title desc">
<title id="title">04 / 예약 실행과 결과 전달</title><desc id="desc">Gateway 안의 scheduler가 예약 상태를 보존하고 실행 시점에 agent run을 요청한다. Agent가 도구를 사용해 판단하고 실행 결과와 전달 결과는 별도로 관측한다.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,sans-serif;fill:#172b42}.heading{font-size:28px;font-weight:700}.label{font-size:23px;font-weight:650}.body{font-size:23px}.note{font-size:21px;fill:#475569}.edge{fill:none;stroke:#475569;stroke-width:2.3;marker-end:url(#arrow)}.return{stroke-dasharray:7 5}.life{stroke:#94a3b8;stroke-width:1.5;stroke-dasharray:6 6}</style>
<rect width="640" height="750" rx="18" fill="#f8fafc"/>
<text x="28" y="44" class="heading" text-anchor="start">04 / 예약 실행과 결과 전달</text>
<rect x="36" y="78" width="132" height="55" rx="12" fill="#eaf3ff" stroke="#90b5de" stroke-width="2"/>
<text x="102.0" y="112" class="label" text-anchor="middle">Scheduler</text>
<path d="M102 133V642" class="life"/>
<rect x="254" y="78" width="132" height="55" rx="12" fill="#eaf3ff" stroke="#90b5de" stroke-width="2"/>
<text x="320.0" y="112" class="label" text-anchor="middle">Agent run</text>
<path d="M320 133V642" class="life"/>
<rect x="472" y="78" width="132" height="55" rx="12" fill="#eaf3ff" stroke="#90b5de" stroke-width="2"/>
<text x="538.0" y="112" class="label" text-anchor="middle">Delivery</text>
<path d="M538 133V642" class="life"/>
<rect x="28" y="166" width="148" height="90" rx="12" fill="#fff7e7" stroke="#cbd5e1" stroke-width="2"/>
<text x="102.0" y="200" class="label" text-anchor="middle">Job 상태</text>
<text x="102.0" y="234" class="body" text-anchor="middle">시점 · 대상</text>
<text x="211.0" y="298" class="body" text-anchor="middle">1. 시점 도달 → 실행</text>
<path d="M102 310H320" class="edge"/>
<rect x="221" y="350" width="198" height="104" rx="12" fill="#f1edff" stroke="#cbd5e1" stroke-width="2"/>
<text x="320.0" y="384" class="label" text-anchor="middle">판단 · 도구 호출</text>
<text x="320.0" y="418" class="body" text-anchor="middle">조건 확인 / 작업</text>
<text x="211.0" y="494" class="body" text-anchor="middle">2. 실행 결과</text>
<path d="M320 506H102" class="edge return"/>
<text x="320.0" y="553" class="body" text-anchor="middle">3. 설정한 경로로 결과 전달</text>
<path d="M102 565H538" class="edge"/>
<text x="320.0" y="615" class="body" text-anchor="middle">4. 전달 결과</text>
<path d="M538 627H102" class="edge return"/>
<text x="28" y="693" class="note" text-anchor="start">개념 순서도: session 방식·delivery 설정에 따라 달라짐</text>
<text x="28" y="723" class="note" text-anchor="start">작업 성공과 알림 도착은 별도의 관측 대상</text>
</svg>
