<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="title desc">
  <title id="title">Fixed test case versus interactive simulator</title>
  <desc id="desc">A shared task and graders can be executed through fixed replay or an interactive environment and user simulator.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#475569"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity=".12"/></filter>
    <style>.title{font:700 30px system-ui,sans-serif;fill:#0f172a}.sub{font:16px system-ui,sans-serif;fill:#64748b}.label{font:700 19px system-ui,sans-serif;fill:#0f172a}.small{font:14px system-ui,sans-serif;fill:#475569}.good{font:700 14px system-ui,sans-serif;fill:#0f766e}.warn{font:700 14px system-ui,sans-serif;fill:#b45309}.box{fill:#fff;stroke:#cbd5e1;stroke-width:2;rx:16;filter:url(#shadow)}.cyan{fill:#ecfeff;stroke:#0f766e}.blue{fill:#eff6ff;stroke:#2563eb}.amber{fill:#fffbeb;stroke:#b45309}.violet{fill:#f5f3ff;stroke:#7c3aed}.line{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="690" rx="24" fill="#f8fafc"/>
  <text x="55" y="56" class="title">Fixed Replay vs Interactive Simulation</text><text x="55" y="86" class="sub">둘 다 task가 필요하다. 차이는 실행 중 상호작용을 고정하는가, 동적으로 생성하는가다.</text>
  <rect x="330" y="120" width="540" height="105" class="box blue"/><text x="600" y="158" text-anchor="middle" class="label">Shared Task Contract</text><text x="600" y="187" text-anchor="middle" class="small">instruction · initial state · tools · success criteria · policy</text>
  <path d="M500 225V270H295V305" class="line"/><path d="M700 225V270H905V305" class="line"/>

  <rect x="80" y="305" width="430" height="210" class="box amber"/><text x="295" y="345" text-anchor="middle" class="label">Fixed TC / Replay</text><text x="295" y="378" text-anchor="middle" class="small">고정 입력 · history · tool evidence</text><text x="130" y="420" class="good">강점</text><text x="185" y="420" class="small">재현성 · 빠른 regression · 원인 격리</text><text x="130" y="455" class="warn">한계</text><text x="185" y="455" class="small">고정 분기 · stale fixture · path 편향</text><text x="295" y="489" text-anchor="middle" class="small">PR / known failures / contract checks</text>

  <rect x="690" y="305" width="430" height="210" class="box cyan"/><text x="905" y="345" text-anchor="middle" class="label">Interactive Simulator</text><text x="905" y="378" text-anchor="middle" class="small">agent ↔ user ↔ executable environment</text><text x="740" y="420" class="good">강점</text><text x="795" y="420" class="small">동적 분기 · 상태 전이 · recovery</text><text x="740" y="455" class="warn">한계</text><text x="795" y="455" class="small">비용 · variance · simulator error</text><text x="905" y="489" text-anchor="middle" class="small">nightly / release / stateful scenarios</text>

  <path d="M295 515V565H480" class="line"/><path d="M905 515V565H720" class="line"/>
  <rect x="390" y="550" width="420" height="95" class="box violet"/><text x="600" y="585" text-anchor="middle" class="label">Shared Grading &amp; Artifacts</text><text x="600" y="613" text-anchor="middle" class="small">outcome · policy · trajectory · repeated trials · provenance</text>
  <text x="55" y="672" class="sub">선택 원칙: 알려진 회귀는 고정하고, 상태 변화와 상호작용 위험은 실행한다.</text>
</svg>
