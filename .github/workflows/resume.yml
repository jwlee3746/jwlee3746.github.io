name: Resume checks
on:
  pull_request:
    paths:
      - 'data/**'
      - 'theme/resume/**'
      - 'scripts/**'
      - 'resume/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.github/workflows/resume.yml'
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'theme/resume/**'
      - 'scripts/**'
      - 'resume/**'
      - 'package*.json'
      - 'tsconfig.json'
      - '.nvmrc'
      - '.github/workflows/resume.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:resume
